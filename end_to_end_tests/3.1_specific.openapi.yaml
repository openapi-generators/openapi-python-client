openapi: "3.1.0"
info:
  title: "Test 3.1 Features"
  description: "Test new OpenAPI 3.1 features"
  version: "0.1.0"
paths:
  "/const/{path}":
    post:
      tags: [ "const" ]
      parameters:
        - in: "path"
          required: true
          schema:
            const: "this goes in the path"
          name: "path"
        - in: "query"
          required: true
          schema:
            const: "this always goes in the query"
          name: "required query"
        - in: "query"
          schema:
            const: "this sometimes goes in the query"
          name: "optional query"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                required:
                  const: "this always goes in the body"
                optional:
                  const: "this sometimes goes in the body"
                nullable:
                  oneOf:
                    - type: "null"
                    - const: "this or null goes in the body"
              required:
                - required
                - nullable
      responses:
        "200":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                const: "Why have a fixed response? I dunno"
  # In 3.1 a binary part is spelled with contentMediaType.
  # This is what FastAPI emits for an UploadFile.
  "/upload":
    post:
      tags: [ "upload" ]
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              type: object
              properties:
                file:
                  type: string
                  contentMediaType: "application/octet-stream"
                files:
                  type: array
                  items:
                    type: string
                    contentMediaType: "application/octet-stream"
                description:
                  type: string
              required:
                - file
      responses:
        "200":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                type: string
  "/prefixItems":
    post:
      tags: [ "prefixItems" ]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                prefixItemsAndItems:
                  type: array
                  prefixItems:
                    - type: string
                      const: "prefix"
                    - type: string
                  items:
                    type: number
                prefixItemsOnly:
                  type: array
                  prefixItems:
                    - type: string
                    - type: number
                  maxItems: 2
      responses:
        "200":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                type: string
