[project]
name = "integration-tests"
version = "0.1.0"
description = "A client library for accessing OpenAPI Test Server"
authors = []
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
    # Runtime deps of the generated client: models are Pydantic and subclass
    # tandem_platform.schema.protected.BaseModel. The latter is the test-only shim
    # shared with the generator's own suite -- see test_support/tandem-platform.
    "pydantic>=2.10,<3.0.0",
    "tandem-platform @ file:///${PROJECT_ROOT}/../test_support/tandem-platform",
]

[tool.pdm]
distribution = true

[tool.pdm.dev-dependencies]
dev = [
    "pytest>8",
    "mypy>=1.13",
    "pytest-asyncio>=0.23.5",
]

[tool.pytest.ini_options]
# Every generated endpoint is async, so every test that calls one is too.
asyncio_mode = "auto"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]

[tool.mypy]
# Just to get mypy to _not_ look at the parent directory's config
